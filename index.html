<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2A6FB5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,0.75);
      --text-tertiary: rgba(255,255,255,0.5);
      --glass-bg: rgba(255,255,255,0.10);
      --glass-bg-strong: rgba(255,255,255,0.18);
      --glass-border: rgba(255,255,255,0.22);
      --glass-blur: 24px;
      --r-xl: 28px; --r-lg: 20px; --r-md: 14px;
      --ease: cubic-bezier(0.25,0.1,0.25,1);
      --spring: cubic-bezier(0.34,1.56,0.64,1);
      --bg-grad: linear-gradient(160deg,#4FA8E0 0%,#2A6FB5 55%,#1B4F8A 100%);
      --menu-w: 310px;
    }
    body[data-weather="clear-day"]    { --bg-grad: linear-gradient(160deg,#5FBCF0 0%,#2E86D6 55%,#1B4F8A 100%); }
    body[data-weather="clear-night"]  { --bg-grad: linear-gradient(160deg,#1B2A4A 0%,#0E1A33 55%,#060B1A 100%); }
    body[data-weather="clouds-day"]   { --bg-grad: linear-gradient(160deg,#7C97AD 0%,#5C7A94 55%,#3E5670 100%); }
    body[data-weather="clouds-night"] { --bg-grad: linear-gradient(160deg,#303B4E 0%,#232B3C 55%,#141A27 100%); }
    body[data-weather="rain-day"]     { --bg-grad: linear-gradient(160deg,#5C7185 0%,#44566B 55%,#2C3A4C 100%); }
    body[data-weather="rain-night"]   { --bg-grad: linear-gradient(160deg,#232E3D 0%,#1A222E 55%,#0F141C 100%); }
    body[data-weather="snow"]         { --bg-grad: linear-gradient(160deg,#B9CBDA 0%,#8FA9C2 55%,#6E89A6 100%); }
    body[data-weather="storm"]        { --bg-grad: linear-gradient(160deg,#4A4E5C 0%,#33363F 55%,#1C1E25 100%); }
    body[data-weather="mist"]         { --bg-grad: linear-gradient(160deg,#A7B4BD 0%,#8B9AA6 55%,#6D7E8C 100%); }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,20px);
      background: var(--bg-grad);
      transition: background 1.2s var(--ease);
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background: radial-gradient(circle at 28% 18%, rgba(255,255,255,0.22), transparent 48%);
      pointer-events: none;
      mix-blend-mode: soft-light;
      z-index: 0;
    }

    /* ── CANVAS ── */
    #sky-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    /* ── MENU OVERLAY ── */
    .menu-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s var(--ease);
    }
    .menu-overlay.open { opacity: 1; pointer-events: all; }

    /* ── SIDE MENU ── */
    .side-menu {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: var(--menu-w); max-width: 92vw;
      background: rgba(8,14,32,0.97);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      border-left: 1px solid rgba(255,255,255,0.10);
      z-index: 300;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
      overflow-y: auto; overscroll-behavior: contain;
      display: flex; flex-direction: column;
    }
    .side-menu.open { transform: translateX(0); }
    .side-menu::-webkit-scrollbar { width: 0; }

    /* Menu header */
    .menu-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(22px, env(safe-area-inset-top, 22px)) 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: sticky; top: 0;
      background: rgba(8,14,32,0.97);
      backdrop-filter: blur(20px);
      z-index: 1;
    }
    .menu-brand {
      display: flex; align-items: center; gap: 10px;
    }
    .menu-brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg,#5FBCF0,#1B6FC8);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      box-shadow: 0 2px 10px rgba(46,134,214,0.4);
    }
    .menu-brand-name {
      font-size: 1rem; font-weight: 700; letter-spacing: -0.01em;
    }
    .menu-brand-ver {
      font-size: 0.62rem; font-weight: 600;
      background: rgba(255,255,255,0.1);
      border-radius: 100px; padding: 2px 7px;
      color: var(--text-tertiary); margin-top: 1px;
    }
    .menu-close {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff;
      transition: background 0.15s;
    }
    .menu-close:hover { background: rgba(255,255,255,0.18); }

    /* Menu sections */
    .menu-section {
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .menu-section:last-child { border-bottom: none; padding-bottom: env(safe-area-inset-bottom,20px); }
    .menu-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px 8px;
    }
    .menu-section-title {
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--text-tertiary);
    }
    .menu-action-btn {
      font-size: 0.72rem; font-weight: 600;
      color: #5FC3F0; background: none; border: none;
      cursor: pointer; padding: 0;
      transition: opacity 0.15s;
    }
    .menu-action-btn:hover { opacity: 0.7; }

    /* Location rows */
    .menu-loc-item {
      display: flex; align-items: center;
      padding: 9px 18px; gap: 11px;
      cursor: pointer; border: none; background: none;
      color: #fff; width: 100%; text-align: left;
      transition: background 0.12s;
      font-family: 'Inter', sans-serif;
    }
    .menu-loc-item:hover { background: rgba(255,255,255,0.05); }
    .menu-loc-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; flex-shrink: 0;
    }
    .menu-loc-info { flex: 1; min-width: 0; }
    .menu-loc-name {
      font-size: 0.88rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .menu-loc-sub { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 1px; }
    .menu-loc-del {
      background: none; border: none;
      color: var(--text-tertiary); cursor: pointer;
      padding: 5px; border-radius: 50%;
      display: flex; align-items: center;
      transition: color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    .menu-loc-del:hover { color: #FF6B6B; background: rgba(255,107,107,0.12); }

    /* History rows */
    .menu-hist-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 18px; cursor: pointer;
      border: none; background: none;
      color: var(--text-secondary); width: 100%;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500;
      text-align: left; transition: background 0.12s, color 0.12s;
    }
    .menu-hist-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

    /* Settings rows */
    .menu-setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 18px;
    }
    .menu-setting-left {}
    .menu-setting-label { font-size: 0.88rem; font-weight: 500; }
    .menu-setting-sub { font-size: 0.68rem; color: var(--text-tertiary); margin-top: 1px; }
    .toggle-group {
      display: flex;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px; padding: 3px; gap: 2px;
    }
    .toggle-opt {
      background: none; border: none;
      color: var(--text-tertiary);
      font-family: 'Inter', sans-serif; font-size: 0.74rem; font-weight: 700;
      padding: 5px 11px; border-radius: 100px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .toggle-opt.active { background: rgba(255,255,255,0.92); color: #1B4F8A; }
    .toggle-opt:not(.active):hover { color: #fff; background: rgba(255,255,255,0.1); }

    /* About */
    .menu-about { padding: 14px 18px; }
    .menu-about-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 5px; }
    .menu-about-body { font-size: 0.75rem; color: var(--text-tertiary); line-height: 1.6; }
    .menu-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px; font-size: 0.65rem; font-weight: 700;
      padding: 3px 10px; color: var(--text-tertiary); margin-top: 9px;
    }

    /* Empty state */
    .menu-empty {
      padding: 10px 18px;
      font-size: 0.78rem; color: var(--text-tertiary);
      font-style: italic; line-height: 1.55;
    }

    /* ── APP SHELL ── */
    .app {
      width: 100%; max-width: 430px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 1; padding-top: 6px;
    }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2px; margin-bottom: -2px;
    }
    .app-logo { display: flex; align-items: center; gap: 9px; }
    .app-logo-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .app-logo-name { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
    /* Back button */
    #back-btn {
      display: none;
      align-items: center; gap: 5px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 100px;
      color: #fff; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
      padding: 7px 13px 7px 10px;
      transition: background 0.15s, transform 0.12s;
    }
    #back-btn:hover { background: var(--glass-bg-strong); }
    #back-btn:active { transform: scale(0.95); }
    #back-btn.visible { display: flex; }
    /* Hamburger button */
    .hamburger {
      display: flex; flex-direction: column; gap: 4.5px; align-items: flex-end;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 11px; padding: 9px 11px;
      cursor: pointer; color: #fff;
      transition: background 0.15s, transform 0.12s;
    }
    .hamburger:hover { background: var(--glass-bg-strong); }
    .hamburger:active { transform: scale(0.93); }
    .hb-line {
      height: 1.8px; background: #fff; border-radius: 2px;
      transition: width 0.2s var(--ease);
    }
    .hb-line:nth-child(1) { width: 18px; }
    .hb-line:nth-child(2) { width: 13px; }
    .hb-line:nth-child(3) { width: 8px; }

    /* ── SEARCH BAR ── */
    .search-wrap { position: relative; }
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 100px;
      padding: 10px 10px 10px 16px;
      transition: background 0.2s, border-color 0.2s;
    }
    .search-bar:focus-within { background: var(--glass-bg-strong); border-color: rgba(255,255,255,0.4); }
    .search-icon { flex-shrink: 0; opacity: 0.65; }
    .city-input {
      flex: 1; min-width: 0; background: transparent;
      border: none; outline: none;
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 0.95rem; font-weight: 500;
    }
    .city-input::placeholder { color: var(--text-tertiary); font-weight: 400; }
    .btn-row { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      background: rgba(255,255,255,0.14); border: none;
      border-radius: 100px; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      transition: background 0.15s, transform 0.12s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.26); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.active { background: rgba(255,255,255,0.32); }
    .search-button {
      flex-shrink: 0;
      background: rgba(255,255,255,0.9); color: #1B4F8A;
      border: none; border-radius: 100px;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.84rem;
      padding: 8px 16px; cursor: pointer;
      transition: transform 0.12s, background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .search-button:hover { background: #fff; }
    .search-button:active { transform: scale(0.95); }
    .search-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── DROPDOWN ── */
    .dropdown {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: rgba(8,14,32,0.94);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border-radius: var(--r-lg); overflow: hidden;
      z-index: 100; animation: dropIn 0.18s var(--ease);
    }
    @keyframes dropIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .dropdown-section-title {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-tertiary); padding: 9px 14px 3px;
    }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; cursor: pointer;
      transition: background 0.12s; border: none; background: none;
      color: #fff; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500;
      width: 100%; text-align: left;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.07); }
    .dropdown-item svg { opacity: 0.55; flex-shrink: 0; }
    .dropdown-item .item-meta { font-size: 0.73rem; color: var(--text-tertiary); font-weight: 400; margin-left: auto; }

    /* ── HOME SCREEN ── */
    .home {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 6px 0 10px;
      animation: rise 0.6s var(--ease);
    }
    .home-clock {
      font-size: 5rem; font-weight: 200;
      letter-spacing: -0.04em; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .home-date {
      font-size: 0.9rem; font-weight: 500;
      color: var(--text-secondary); margin-top: 2px;
    }
    .orb-wrap {
      position: relative; width: 180px; height: 180px;
      margin: 18px auto 10px; cursor: pointer;
    }
    .orb-wrap:hover .orb-main { transform: scale(1.05); }
    .orb-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.18);
      animation: orbRing 8s linear infinite;
    }
    .orb-ring:nth-child(2) { inset: 14px; border-color: rgba(255,255,255,0.10); animation-duration: 12s; animation-direction: reverse; }
    @keyframes orbRing { to { transform: rotate(360deg); } }
    .orb-main {
      position: absolute; inset: 22px; border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, rgba(255,255,255,0.35), rgba(255,255,255,0.06) 60%);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.3s var(--spring);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .orb-main svg { width: 68px; height: 68px; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.3)); }
    .orb-pulse {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      animation: pulse 3s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform:scale(1); opacity:.5; }
      70% { transform:scale(1.12); opacity:0; }
      100% { transform:scale(1.12); opacity:0; }
    }
    .orb-label {
      position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-tertiary); white-space: nowrap;
    }
    .home-tagline { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 4px; }
    .home-sub { font-size: 0.83rem; color: var(--text-secondary); max-width: 255px; line-height: 1.55; margin-bottom: 16px; }
    .chips-label {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-tertiary); margin-bottom: 7px; align-self: flex-start;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; width: 100%; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 100px; padding: 7px 13px;
      font-size: 0.79rem; font-weight: 600; color: #fff;
      cursor: pointer; user-select: none;
      transition: background 0.15s, transform 0.12s var(--spring), border-color 0.15s;
    }
    .chip:hover { background: var(--glass-bg-strong); border-color: rgba(255,255,255,0.4); transform: translateY(-2px); }
    .chip:active { transform: scale(0.95); }
    .chip-flag { font-size: 0.9rem; }
    .home-stats { display: flex; gap: 8px; width: 100%; margin-top: 16px; }
    .home-stat {
      flex: 1;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--r-md); padding: 11px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .home-stat-icon { font-size: 1rem; }
    .home-stat-val { font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .home-stat-lbl { font-size: 0.6rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; text-align: center; }

    /* ── STAGE ── */
    .stage { min-height: 300px; display: flex; align-items: center; justify-content: center; }
    .loading {
      display: flex; flex-direction: column; align-items: center;
      gap: 15px; color: var(--text-secondary); font-size: 0.88rem; font-weight: 500;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2.5px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── WEATHER CARD ── */
    .weather-card {
      width: 100%; display: flex; flex-direction: column;
      align-items: center; text-align: center;
      animation: rise 0.5s var(--ease);
    }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .location-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em;
      flex-wrap: wrap; justify-content: center;
    }
    .location-row .country { font-size: 0.88rem; font-weight: 400; color: var(--text-tertiary); }
    .fav-btn {
      background: none; border: none; cursor: pointer; color: #fff;
      padding: 4px; display: flex; align-items: center;
      transition: transform 0.2s var(--spring), opacity 0.15s; opacity: 0.7;
    }
    .fav-btn:hover { opacity: 1; transform: scale(1.2); }
    .fav-btn.is-fav { opacity: 1; }
    .fav-btn.is-fav svg { fill: rgba(255,220,50,1); stroke: rgba(255,200,0,1); }
    .updated-at { font-size: 0.73rem; color: var(--text-tertiary); margin-top: 2px; }
    .weather-icon {
      width: 140px; height: 140px; margin: 4px 0 -10px;
      filter: drop-shadow(0 8px 28px rgba(0,0,0,0.3));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    .temperature {
      font-size: 5.6rem; font-weight: 200;
      line-height: 1; letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }
    .temperature span { font-size: 2.4rem; vertical-align: super; position: relative; top: 0.4rem; font-weight: 200; }
    .description { font-size: 1.05rem; font-weight: 600; text-transform: capitalize; margin-top: -4px; }
    .temp-range { font-size: 0.83rem; color: var(--text-secondary); margin-top: 2px; font-weight: 400; }

    /* Stat grid */
    .stat-grid {
      width: 100%; display: grid; grid-template-columns: repeat(4,1fr);
      gap: 7px; margin-top: 16px;
    }
    .stat-tile {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--r-md); padding: 11px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: background 0.15s, transform 0.12s var(--spring);
    }
    .stat-tile:hover { background: var(--glass-bg-strong); transform: translateY(-2px); }
    .stat-tile svg { opacity: 0.72; }
    .stat-value { font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 0.6rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; text-align: center; }

    /* ── TABS ── */
    .tabs-bar {
      width: 100%; display: flex; gap: 4px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 100px; padding: 4px;
    }
    .tab-btn {
      flex: 1; background: transparent; border: none;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 600;
      padding: 7px 4px; border-radius: 100px; cursor: pointer;
      transition: background 0.18s, color 0.18s; white-space: nowrap;
    }
    .tab-btn.active { background: rgba(255,255,255,0.92); color: #1B4F8A; }
    .tab-btn:not(.active):hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* ── PANELS ── */
    .panel {
      width: 100%;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--r-xl); animation: rise 0.35s var(--ease); overflow: hidden;
    }
    .panel-title {
      font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-tertiary); padding: 13px 18px 7px;
    }

    /* Hourly */
    .hourly-scroll {
      display: flex; overflow-x: auto; scrollbar-width: none;
      padding: 0 8px 13px;
    }
    .hourly-scroll::-webkit-scrollbar { display: none; }
    .hour-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 9px 11px; flex-shrink: 0;
      border-radius: var(--r-md); min-width: 60px;
      transition: background 0.15s;
    }
    .hour-item.now { background: rgba(255,255,255,0.15); }
    .hour-label { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); }
    .hour-item.now .hour-label { color: #fff; }
    .hour-icon { width: 26px; height: 26px; }
    .hour-temp { font-size: 0.86rem; font-weight: 700; }
    .hour-pop { font-size: 0.67rem; color: #9FC6FF; font-weight: 500; }

    /* 5-day */
    .day-row {
      display: flex; align-items: center; padding: 10px 18px; gap: 9px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .day-row:first-of-type { border-top: none; }
    .day-name { font-size: 0.88rem; font-weight: 700; width: 44px; flex-shrink: 0; }
    .day-icon { width: 26px; height: 26px; flex-shrink: 0; }
    .day-desc { font-size: 0.73rem; color: var(--text-secondary); flex: 1; text-transform: capitalize; }
    .temp-bar-wrap { flex: 1; display: flex; align-items: center; }
    .temp-bar { height: 4px; border-radius: 100px; background: linear-gradient(90deg,#9FC6FF,#FFD23F,#FF6B35); opacity: 0.7; }
    .day-temps { display: flex; gap: 7px; align-items: center; font-size: 0.84rem; font-weight: 700; flex-shrink: 0; }
    .day-temps .lo { color: var(--text-tertiary); font-weight: 400; }

    /* Details */
    .uv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255,255,255,0.07); }
    .uv-cell {
      background: transparent; padding: 13px 18px;
      display: flex; flex-direction: column; gap: 3px;
      transition: background 0.12s;
    }
    .uv-cell:hover { background: rgba(255,255,255,0.04); }
    .uv-cell-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); }
    .uv-cell-value { font-size: 1.35rem; font-weight: 300; letter-spacing: -0.02em; }
    .uv-cell-sub { font-size: 0.75rem; color: var(--text-secondary); }
    .uv-bar-wrap { padding: 13px 18px; }
    .uv-label-row { display: flex; justify-content: space-between; font-size: 0.67rem; color: var(--text-tertiary); margin-bottom: 5px; }
    .uv-bar { height: 6px; border-radius: 100px; background: linear-gradient(90deg,#57D168,#FFD23F,#FF8C00,#FF3333,#9B59B6); }
    .uv-marker {
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; border: 2px solid rgba(0,0,0,0.3);
      position: relative; top: -9px; transform: translateX(-50%);
      margin-left: 0%; transition: margin-left 0.5s var(--ease);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* ── ERROR ── */
    .error-message {
      display: flex; flex-direction: column; align-items: center;
      gap: 13px; text-align: center;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--r-lg); padding: 34px 28px;
      width: 100%; animation: rise 0.4s var(--ease);
    }
    .error-title { font-weight: 700; font-size: 1rem; }
    .error-detail { font-size: 0.83rem; color: var(--text-secondary); max-width: 250px; line-height: 1.5; }
    .retry-button {
      background: rgba(255,255,255,0.9); color: #1B4F8A; border: none;
      border-radius: 100px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.83rem;
      padding: 9px 20px; cursor: pointer; transition: transform 0.12s, background 0.15s;
    }
    .retry-button:hover { background: #fff; }
    .retry-button:active { transform: scale(0.95); }

    /* ── FOOTER ── */
    .footer { text-align: center; font-size: 0.68rem; color: var(--text-tertiary); padding: 5px 0 3px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(6,12,28,0.95); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: #fff; font-size: 0.82rem; font-weight: 600;
      padding: 9px 20px; border-radius: 100px;
      z-index: 999; white-space: nowrap;
      animation: toastIn 0.25s var(--spring); pointer-events: none;
    }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(14px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    .toast.hide { animation: toastOut 0.2s var(--ease) forwards; }
    @keyframes toastOut { to { opacity:0; transform:translateX(-50%) translateY(8px); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 380px) {
      .temperature { font-size: 4.5rem; }
      .weather-icon { width: 120px; height: 120px; }
      .stat-grid { grid-template-columns: repeat(2,1fr); }
      .home-clock { font-size: 3.8rem; }
      .orb-wrap { width: 150px; height: 150px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.6s; }
      .weather-card, .error-message, .home { animation: none; }
      .weather-icon, .orb-ring, .orb-pulse { animation: none; }
      body { transition: none; }
    }
  </style>
</head>

  <script>
  (() => {
    'use strict';

    const API_KEY = "bb883dca1fe2a43bf61f0a54748b3d85";
    const BASE    = "https://api.openweathermap.org/data/2.5";

    const state = {
      history:     JSON.parse(localStorage.getItem('wx_history')   || '[]'),
      favorites:   JSON.parse(localStorage.getItem('wx_favorites') || '[]'),
      settings:    JSON.parse(localStorage.getItem('wx_settings')  || '{"unit":"C","windUnit":"kmh"}'),
      currentCity: null,
      currentData: null,
      forecastData: null,
      activeTab:   'hourly',
      homeMode:    true,
    };

    // Elements
    const $ = id => document.getElementById(id);
    const cityInput       = $('city-input');
    const searchBtn       = $('search-button');
    const geoBtn          = $('geo-btn');
    const stage           = $('stage');
    const dropdown        = $('dropdown');
    const forecastSection = $('forecast-section');
    const tabsBar         = $('tabs-bar');
    const tabContent      = $('tab-content');
    const backBtn         = $('back-btn');
    const appLogo         = $('app-logo');
    const menuBtn         = $('menu-btn');
    const menuOverlay     = $('menu-overlay');
    const sideMenu        = $('side-menu');
    const menuCloseBtn    = $('menu-close-btn');
    const menuBody        = $('menu-body');

    /* ── ICONS ── */
    const ICONS = {
      sun:`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#FFD23F"/><g stroke="#FFD23F" stroke-width="2" stroke-linecap="round"><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g></svg>`,
      moon:`<svg viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="#E8ECF4"/></svg>`,
      cloud:`<svg viewBox="0 0 24 24" fill="none"><path d="M6.5 18a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.4 8.2 5 5 0 0 1 18.5 18h-12z" fill="#E3E9F0"/></svg>`,
      'cloud-sun':`<svg viewBox="0 0 24 24" fill="none"><circle cx="8.5" cy="8" r="3.5" fill="#FFD23F"/><g stroke="#FFD23F" stroke-width="1.6" stroke-linecap="round"><path d="M8.5 1.5v2M8.5 12.5v2M2 8h2M13 8h2M4.1 3.6l1.4 1.4M11.5 11l1.4 1.4M4.1 12.4l1.4-1.4M11.5 5l1.4-1.4"/></g><path d="M7.5 19a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 18.4 9.2 5 5 0 0 1 19.5 19h-12z" fill="#E3E9F0"/></svg>`,
      'cloud-moon':`<svg viewBox="0 0 24 24" fill="none"><path d="M16 7.5a5.2 5.2 0 1 1-5.7-5.18A4.1 4.1 0 0 0 16 7.5z" fill="#E8ECF4"/><path d="M7.5 19a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 18.4 9.2 5 5 0 0 1 19.5 19h-12z" fill="#C9D2DE"/></svg>`,
      rain:`<svg viewBox="0 0 24 24" fill="none"><path d="M6.5 14a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.4 4.2 5 5 0 0 1 18.5 14h-12z" fill="#CBD5E1"/><g stroke="#9FC6FF" stroke-width="2" stroke-linecap="round"><path d="M8 17l-1.2 2.4M12 17l-1.2 2.4M16 17l-1.2 2.4"/></g></svg>`,
      storm:`<svg viewBox="0 0 24 24" fill="none"><path d="M6.5 13a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.4 3.2 5 5 0 0 1 18.5 13h-12z" fill="#9AA7B8"/><path d="M13 12l-3 5h2.5L11 22l4.5-7H13l1.5-3z" fill="#FFD23F"/></svg>`,
      snow:`<svg viewBox="0 0 24 24" fill="none"><path d="M6.5 13a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.4 3.2 5 5 0 0 1 18.5 13h-12z" fill="#DCE6F2"/><g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M8 16.5v5M5.5 18l5 2M10.5 18l-5 2M16 16.5v5M13.5 18l5 2M18.5 18l-5 2"/></g></svg>`,
      mist:`<svg viewBox="0 0 24 24" fill="none"><g stroke="#D7DEE7" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M2 12h20M5 17h14"/></g></svg>`,
    };

    const QUICK_CITIES = [
      {name:'New York',flag:'🇺🇸'},{name:'London',flag:'🇬🇧'},
      {name:'Tokyo',flag:'🇯🇵'},{name:'Paris',flag:'🇫🇷'},
      {name:'Sydney',flag:'🇦🇺'},{name:'Dubai',flag:'🇦🇪'},
    ];

    /* ── UNIT HELPERS ── */
    function displayTemp(celsius) {
      return state.settings.unit === 'F'
        ? Math.round(celsius * 9/5 + 32)
        : Math.round(celsius);
    }
    function windLabel() { return state.settings.windUnit === 'mph' ? 'mph' : 'km/h'; }
    function displayWind(kmh) {
      return state.settings.windUnit === 'mph'
        ? Math.round(kmh * 0.621371)
        : Math.round(kmh);
    }

    /* ── CONDITION MAPPER ── */
    function mapCondition(code, isDay) {
      const dn = isDay ? 'day' : 'night';
      if (code >= 200 && code < 300) return {icon:'storm',  scene:'storm'};
      if (code >= 300 && code < 600) return {icon:'rain',   scene:`rain-${dn}`};
      if (code >= 600 && code < 700) return {icon:'snow',   scene:'snow'};
      if (code >= 700 && code < 800) return {icon:'mist',   scene:'mist'};
      if (code === 800)              return {icon:isDay?'sun':'moon', scene:`clear-${dn}`};
      if (code <= 802)               return {icon:isDay?'cloud-sun':'cloud-moon', scene:`clouds-${dn}`};
      return {icon:'cloud', scene:`clouds-${dn}`};
    }
    function isDaytime(data) {
      return data.dt >= data.sys.sunrise && data.dt < data.sys.sunset;
    }
    function degToCompass(d) {
      return ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
    }

    /* ── SKY CANVAS ── */
    const canvas = $('sky-canvas');
    const ctx    = canvas.getContext('2d');
    let particles = [], mouseX = 0.5, mouseY = 0.5, animFrame;

    function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('mousemove', e => {
      mouseX = e.clientX / innerWidth; mouseY = e.clientY / innerHeight;
    });

    function initCanvas(scene) {
      particles = [];
      if (animFrame) cancelAnimationFrame(animFrame);
      const w = canvas.width, h = canvas.height;
      if (scene.includes('clear') || scene.includes('clouds')) {
        const n = scene.includes('night');
        for (let i = 0; i < (n?120:30); i++) particles.push({
          x:Math.random()*w, y:Math.random()*h,
          r:Math.random()*(n?1.5:3)+0.5,
          a:Math.random()*(n?0.9:0.12)+0.05,
          speed:Math.random()*0.3+0.05,
          twinkle:n?Math.random()*Math.PI*2:0,
          twinkleSpeed:Math.random()*0.03+0.01,
          parallax:Math.random()*0.06+0.01,
        });
      } else if (scene.includes('rain')) {
        for (let i = 0; i < 80; i++) particles.push({
          x:Math.random()*w, y:Math.random()*h,
          len:Math.random()*18+8, speed:Math.random()*6+8,
          a:Math.random()*0.35+0.1, angle:1.65+(Math.random()-0.5)*0.2,
        });
      } else if (scene === 'snow') {
        for (let i = 0; i < 60; i++) particles.push({
          x:Math.random()*w, y:Math.random()*h,
          r:Math.random()*3+1.5, speed:Math.random()*1.2+0.4,
          drift:(Math.random()-0.5)*0.5, a:Math.random()*0.6+0.2,
          wobble:Math.random()*Math.PI*2,
        });
      } else if (scene === 'storm') {
        for (let i = 0; i < 100; i++) particles.push({
          x:Math.random()*w, y:Math.random()*h,
          len:Math.random()*22+10, speed:Math.random()*12+14,
          a:Math.random()*0.2+0.06, angle:1.7+(Math.random()-0.5)*0.3,
        });
      } else {
        for (let i = 0; i < 12; i++) particles.push({
          x:Math.random()*w, y:Math.random()*h*0.6+h*0.2,
          w:Math.random()*200+100, h:Math.random()*40+20,
          speed:Math.random()*0.3+0.1, a:Math.random()*0.06+0.02,
        });
      }
      drawCanvas(scene);
    }

    function drawCanvas(scene) {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);
      const mx=(mouseX-0.5)*30, my=(mouseY-0.5)*20;
      if (scene.includes('clear')||scene.includes('clouds')) {
        const n = scene.includes('night');
        particles.forEach(p => {
          if (n) {
            p.twinkle += p.twinkleSpeed;
            const a = p.a*(0.6+0.4*Math.sin(p.twinkle));
            ctx.beginPath(); ctx.arc(p.x+mx*p.parallax, p.y+my*p.parallax, p.r,0,Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
          } else {
            ctx.beginPath(); ctx.arc(p.x+mx*p.parallax, p.y+my*p.parallax, p.r,0,Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${p.a})`; ctx.fill();
          }
          p.y -= p.speed*0.12; if (p.y < -10) p.y = h+10;
        });
      } else if (scene.includes('rain')||scene==='storm') {
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+Math.cos(p.angle)*p.len, p.y+Math.sin(p.angle)*p.len);
          ctx.strokeStyle=`rgba(180,210,255,${p.a})`; ctx.lineWidth=scene==='storm'?1:1.2; ctx.stroke();
          p.x+=Math.cos(p.angle)*p.speed; p.y+=Math.sin(p.angle)*p.speed;
          if (p.y>h+20||p.x<-20||p.x>w+20) { p.x=Math.random()*w*1.2; p.y=-20; }
        });
      } else if (scene==='snow') {
        particles.forEach(p => {
          p.wobble+=0.02;
          ctx.beginPath(); ctx.arc(p.x+Math.sin(p.wobble)*2,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,255,255,${p.a})`; ctx.fill();
          p.y+=p.speed; p.x+=p.drift;
          if (p.y>h+10) { p.y=-10; p.x=Math.random()*w; }
        });
      } else {
        particles.forEach(p => {
          const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.w/2);
          g.addColorStop(0,`rgba(255,255,255,${p.a})`); g.addColorStop(1,'rgba(255,255,255,0)');
          ctx.save(); ctx.scale(1,p.h/p.w);
          ctx.beginPath(); ctx.arc(p.x,p.y*(p.w/p.h),p.w/2,0,Math.PI*2);
          ctx.fillStyle=g; ctx.fill(); ctx.restore();
          p.x+=p.speed; if (p.x>w+p.w) p.x=-p.w;
        });
      }
      animFrame = requestAnimationFrame(()=>drawCanvas(scene));
    }
    initCanvas('clear-day');

    /* ── TOAST ── */
    let toastTimer;
    function showToast(msg) {
      let t = document.querySelector('.toast');
      if (t) { t.remove(); clearTimeout(toastTimer); }
      t = document.createElement('div'); t.className='toast'; t.textContent=msg;
      document.body.appendChild(t);
      toastTimer = setTimeout(()=>{ t.classList.add('hide'); setTimeout(()=>t.remove(),200); },2500);
    }

    /* ── STORAGE ── */
    const saveHistory   = () => localStorage.setItem('wx_history',   JSON.stringify(state.history));
    const saveFavorites = () => localStorage.setItem('wx_favorites', JSON.stringify(state.favorites));
    const saveSettings  = () => localStorage.setItem('wx_settings',  JSON.stringify(state.settings));

    function addToHistory(city) {
      state.history = [city, ...state.history.filter(c=>c.toLowerCase()!==city.toLowerCase())].slice(0,8);
      saveHistory();
    }
    function isFavorite(city) {
      return state.favorites.some(c=>c.toLowerCase()===city.toLowerCase());
    }
    function toggleFavorite(city) {
      const idx = state.favorites.findIndex(c=>c.toLowerCase()===city.toLowerCase());
      if (idx===-1) { state.favorites.unshift(city); showToast(`⭐ ${city} saved`); }
      else          { state.favorites.splice(idx,1);  showToast(`Removed ${city}`); }
      saveFavorites();
      const btn = $('fav-btn');
      if (btn) {
        const fav = isFavorite(city);
        btn.classList.toggle('is-fav', fav);
        btn.querySelector('svg').setAttribute('fill', fav?'rgba(255,220,50,1)':'none');
        btn.querySelector('svg').setAttribute('stroke', fav?'rgba(255,200,0,1)':'white');
      }
      if (sideMenu.classList.contains('open')) renderMenuBody();
    }

    /* ── SIDE MENU ── */
    function openMenu() {
      renderMenuBody();
      sideMenu.classList.add('open');
      menuOverlay.classList.add('open');
      menuBtn.setAttribute('aria-expanded','true');
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      sideMenu.classList.remove('open');
      menuOverlay.classList.remove('open');
      menuBtn.setAttribute('aria-expanded','false');
      document.body.style.overflow = '';
    }

    function renderMenuBody() {
      const C = state.settings.unit, W = state.settings.windUnit;
      let html = '';

      /* MY LOCATIONS */
      html += `<div class="menu-section">
        <div class="menu-section-header">
          <span class="menu-section-title">⭐ My Locations</span>
          ${state.favorites.length>0?'<span style="font-size:.68rem;color:var(--text-tertiary)">tap to load</span>':''}
        </div>`;
      if (state.favorites.length===0) {
        html += `<p class="menu-empty">No saved locations yet.<br>Search a city and tap ★ to save it.</p>`;
      } else {
        state.favorites.forEach(city => {
          html += `<div class="menu-loc-item" data-city="${city}" role="button" tabindex="0">
            <div class="menu-loc-icon">📍</div>
            <div class="menu-loc-info">
              <div class="menu-loc-name">${city}</div>
              <div class="menu-loc-sub">Saved location</div>
            </div>
            <button class="menu-loc-del" data-remove="${city}" title="Remove ${city}" aria-label="Remove ${city}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>`;
        });
      }
      html += `</div>`;

      /* RECENT */
      html += `<div class="menu-section">
        <div class="menu-section-header">
          <span class="menu-section-title">🕐 Recent</span>
          ${state.history.length>0?'<button class="menu-action-btn" id="clear-hist-btn">Clear All</button>':''}
        </div>`;
      if (state.history.length===0) {
        html += `<p class="menu-empty">No recent searches yet.</p>`;
      } else {
        state.history.slice(0,6).forEach(city => {
          html += `<button class="menu-hist-item" data-city="${city}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>

      html += `</div>`;

      /* SETTINGS */
      html += `<div class="menu-section">
        <div class="menu-section-header">
          <span class="menu-section-title">⚙️ Settings</span>
        </div>
        <div class="menu-setting-row">

          </div>
        </div>

      /* ABOUT */
      html += `<div class="menu-section">
        <div class="menu-about">

      menuBody.innerHTML = html;

      /* — Event wiring — */
      // Location click (load city)
      menuBody.querySelectorAll('.menu-loc-item[data-city]').forEach(item => {

      // Remove favorite
      menuBody.querySelectorAll('.menu-loc-del[data-remove]').forEach(btn => {

          if (state.currentCity && state.currentCity.toLowerCase()===city.toLowerCase()) {

      menuBody.querySelectorAll('[data-unit]').forEach(btn => {

        btn.addEventListener('click', () => {
          state.settings.windUnit = btn.dataset.wind; saveSettings(); renderMenuBody();

    backBtn.addEventListener('click', () => {
      cityInput.value = '';
      renderHome();
    });
    menuBtn.addEventListener('click', openMenu);
    menuCloseBtn.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', closeMenu);
    document.addEventListener('keydown', e => {
      if (e.key==='Escape' && sideMenu.classList.contains('open')) closeMenu();

    /* ── DROPDOWN ── */
    function renderDropdown() {
      if (!state.favorites.length && !state.history.length) { dropdown.style.display='none'; return; }
      let html = '';
      if (state.favorites.length) {
        html += `<div class="dropdown-section-title">⭐ Favorites</div>`;
        state.favorites.forEach(city => {
          html += `<button class="dropdown-item" data-city="${city}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="rgba(255,220,50,.9)" stroke="rgba(255,200,0,.9)" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            ${city}<span class="item-meta">Saved</span></button>`;
        });
      }
      if (state.history.length) {
        html += `<div class="dropdown-section-title">🕐 Recent</div>`;
        state.history.slice(0,5).forEach(city => {
          html += `<button class="dropdown-item" data-city="${city}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>

        });

      dropdown.style.display = 'block';

    cityInput.addEventListener('focus', () => { if (state.favorites.length||state.history.length) renderDropdown(); });
    cityInput.addEventListener('input', () => {
      if (cityInput.value.trim()) closeDropdown();
      else if (state.favorites.length||state.history.length) renderDropdown();
    });
    document.addEventListener('click', e => { if (!$('search-wrap').contains(e.target)) closeDropdown(); });

    /* ── CLOCK ── */
    function updateClock() {
      const cl=$('home-clock'), dl=$('home-date'); if(!cl) return;
      const now=new Date();
      cl.textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
      dl.textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    }

    /* ── HOME ── */
    const hour = new Date().getHours();
    const greeting = hour<5?'Good night':hour<12?'Good morning':hour<17?'Good afternoon':hour<21?'Good evening':'Good night';
    const homeIcon = hour>=6&&hour<19?'cloud-sun':'cloud-moon';

    function renderHome() {
      state.homeMode = true;
      forecastSection.style.display = 'none';
      backBtn.classList.remove('visible');

      document.body.setAttribute('data-weather', sc);
      initCanvas(sc);

      const chipsHTML = QUICK_CITIES.map(c =>

      ).join('');

          <div class="orb-ring"></div><div class="orb-ring"></div>
          <div class="orb-pulse"></div>
          <div class="orb-main">${ICONS[homeIcon]}</div>

        </div>

        <div class="chips">${chipsHTML}</div>
        <div class="home-stats">
          <div class="home-stat">
            <span class="home-stat-icon">🌍</span>
            <span class="home-stat-val" id="tz-val">—</span>
            <span class="home-stat-lbl">Timezone</span>
          </div>
          <div class="home-stat">
            <span class="home-stat-icon">📅</span>
            <span class="home-stat-val" id="day-val">—</span>
            <span class="home-stat-lbl">Day #</span>
          </div>
          <div class="home-stat">
            <span class="home-stat-icon">🌅</span>
            <span class="home-stat-val" id="gold-val">—</span>
            <span class="home-stat-lbl">Golden hr</span>
          </div>
        </div>
      </div>`;

      updateClock();
      const clk = setInterval(()=>{ if(!state.homeMode){clearInterval(clk);return;} updateClock(); },1000);

      const tzOff = -(new Date().getTimezoneOffset()/60);
      $('tz-val').textContent = `UTC${tzOff>=0?'+':''}${tzOff}`;
      const now = new Date(), s = new Date(now.getFullYear(),0,0);
      $('day-val').textContent = `#${Math.floor((now-s)/86400000)}`;
      const sr = 6+(360-new Date().getTimezoneOffset())/60%2;
      const gh = new Date(); gh.setHours(Math.round(sr+1),0,0);
      $('gold-val').textContent = gh.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});

      $('home-orb').addEventListener('click',()=>{ cityInput.focus(); cityInput.scrollIntoView({behavior:'smooth',block:'center'}); });
      stage.querySelectorAll('.chip[data-city]').forEach(btn => {
        btn.addEventListener('click',()=>{ cityInput.value=btn.dataset.city; fetchAll(btn.dataset.city); });
      });

    /* ── LOADING / ERROR ── */
    function renderLoading() {
      state.homeMode=false;
      stage.innerHTML=`<div class="loading" role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><span>Fetching weather…</span></div>`;
      forecastSection.style.display='none';
    }
    function renderError(title, detail) {
      stage.innerHTML=`<div class="error-message" role="alert">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span class="error-title">${title}</span>
        <span class="error-detail">${detail}</span>
        <button class="retry-button" id="retry-btn">Try again</button>
      </div>`;
      forecastSection.style.display='none';
      $('retry-btn')?.addEventListener('click',()=>{ renderHome(); cityInput.focus(); });
    }

    /* ── WEATHER CARD ── */
    function renderWeather(data) {
      state.homeMode = false;
      backBtn.classList.add('visible');
      appLogo.style.display = 'none';
      const city    = data.name;
      const country = data.sys?.country ?? '';
      const tempC   = data.main.temp;
      const feelsC  = data.main.feels_like;
      const humid   = data.main.humidity;
      const wKmh    = data.wind.speed * 3.6;
      const vis     = data.visibility ? (data.visibility/1000).toFixed(1) : '—';
      const desc    = data.weather[0].description;
      const code    = data.weather[0].id;
      const day     = isDaytime(data);
      const {icon, scene} = mapCondition(code, day);
      const updated = new Date(data.dt*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

      document.body.setAttribute('data-weather', scene);
      state.currentCity = city;
      initCanvas(scene);

      let rangeHtml = '';
      if (state.forecastData) {
        const today = state.forecastData.list.filter(i=>new Date(i.dt*1000).toDateString()===new Date().toDateString());
        if (today.length) {
          const hiC = Math.max(...today.map(t=>t.main.temp_max));
          const loC = Math.min(...today.map(t=>t.main.temp_min));
          rangeHtml = `<div class="temp-range">H:${displayTemp(hiC)}° · L:${displayTemp(loC)}°</div>`;

      stage.innerHTML = `<div class="weather-card" aria-live="polite">

          <button class="fav-btn ${fav?'is-fav':''}" id="fav-btn" title="Save to favorites" aria-label="Save to favorites">
            <svg width="17" height="17" viewBox="0 0 24 24"
              fill="${fav?'rgba(255,220,50,1)':'none'}"
              stroke="${fav?'rgba(255,200,0,1)':'white'}"
              stroke-width="2" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>

          </button>
        </div>
        <span class="updated-at">Updated ${updated}</span>
        <div class="weather-icon" aria-hidden="true">${ICONS[icon]}</div>
        <div class="temperature">${displayTemp(tempC)}<span>°</span></div>
        ${rangeHtml}
        <div class="description">${desc}</div>
        <div class="stat-grid">
          <div class="stat-tile">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><path d="M14 14.76V3.5a2 2 0 0 0-4 0v11.26a4 4 0 1 0 4 0z"/></svg>
            <span class="stat-value">${displayTemp(feelsC)}°</span>
            <span class="stat-label">Feels like</span>
          </div>
          <div class="stat-tile">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><path d="M12 3C9 7 6 10.5 6 14a6 6 0 0 0 12 0c0-3.5-3-7-6-11z"/></svg>
            <span class="stat-value">${humid}%</span>
            <span class="stat-label">Humidity</span>
          </div>
          <div class="stat-tile">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h12a3 3 0 1 0-3-3M3 18h15a3 3 0 1 0-3-3M3 6h9a3 3 0 1 1-3 3"/></svg>
            <span class="stat-value">${displayWind(wKmh)}</span>
            <span class="stat-label">${windLabel()}</span>
          </div>
          <div class="stat-tile">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            <span class="stat-value">${vis}</span>
            <span class="stat-label">km vis.</span>
          </div>
        </div>
      </div>`;

      $('fav-btn')?.addEventListener('click',()=>toggleFavorite(city));
    }

    /* ── HOURLY ── */
    function renderHourly(fd) {
      if (!fd) { tabContent.innerHTML=''; return; }
      const html = fd.list.slice(0,12).map((item,i)=>{
        const dt   = new Date(item.dt*1000);
        const lbl  = i===0?'Now':dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
        const {icon} = mapCondition(item.weather[0].id, item.sys?.pod==='d');
        const pop  = item.pop?Math.round(item.pop*100):0;
        return `<div class="hour-item ${i===0?'now':''}">
          <span class="hour-label">${lbl}</span>
          <span class="hour-icon">${ICONS[icon]}</span>
          <span class="hour-temp">${displayTemp(item.main.temp)}°</span>
          ${pop>10?`<span class="hour-pop">💧${pop}%</span>`:'<span class="hour-pop" style="visibility:hidden">0%</span>'}
        </div>`;
      }).join('');
      tabContent.innerHTML = `<div class="panel"><div class="panel-title">🕐 HOURLY FORECAST</div><div class="hourly-scroll">${html}</div></div>`;
    }

    /* ── 5-DAY ── */
    function renderDaily(fd) {
      if (!fd) { tabContent.innerHTML=''; return; }
      const days={};
      fd.list.forEach(item=>{
        const k=new Date(item.dt*1000).toDateString();
        if(!days[k]) days[k]={items:[],dt:new Date(item.dt*1000)};
        days[k].items.push(item);
      });
      const keys=Object.keys(days).slice(0,5);
      const all=fd.list.map(i=>i.main.temp);
      const gMin=Math.min(...all), gMax=Math.max(...all);
      const html=keys.map((k,idx)=>{
        const d=days[k], temps=d.items.map(i=>i.main.temp);
        const hiC=Math.max(...temps), loC=Math.min(...temps);
        const mid=d.items[Math.floor(d.items.length/2)];
        const {icon}=mapCondition(mid.weather[0].id,true);
        const dname=idx===0?'Today':d.dt.toLocaleDateString('en-US',{weekday:'short'});
        const left=((loC-gMin)/(gMax-gMin)*100).toFixed(1);
        const width=Math.max(((hiC-loC)/(gMax-gMin)*100),8).toFixed(1);
        return `<div class="day-row">
          <span class="day-name">${dname}</span>
          <span class="day-icon">${ICONS[icon]}</span>
          <span class="day-desc">${mid.weather[0].description}</span>
          <div class="temp-bar-wrap"><div class="temp-bar" style="margin-left:${left}%;width:${width}%"></div></div>
          <div class="day-temps"><span class="lo">${displayTemp(loC)}°</span><span>${displayTemp(hiC)}°</span></div>
        </div>`;
      }).join('');
      tabContent.innerHTML = `<div class="panel"><div class="panel-title">📅 5-DAY FORECAST</div>${html}</div>`;
    }

    /* ── DETAILS ── */
    function renderDetails(cd) {
      if (!cd) return;
      const pressure = cd.main?.pressure??'—';
      const humidity = cd.main?.humidity??'—';
      const wGust    = cd.wind?.gust ? displayWind(cd.wind.gust*3.6) : '—';
      const wDir     = cd.wind?.deg!==undefined ? degToCompass(cd.wind.deg) : '—';
      const clouds   = cd.clouds?.all??'—';
      const sunrise  = cd.sys?.sunrise ? new Date(cd.sys.sunrise*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) : '—';
      const sunset   = cd.sys?.sunset  ? new Date(cd.sys.sunset *1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) : '—';
      const h2=new Date().getHours();
      let uv=0;
      if (h2>=6&&h2<=18) uv=Math.round(Math.max(0,10-Math.abs(h2-12)*0.9)*(1-(clouds/100)*0.6));
      const uvLbl=uv<=2?'Low':uv<=5?'Moderate':uv<=7?'High':uv<=10?'Very High':'Extreme';
      const uvPct=Math.min(uv/11*100,100).toFixed(1);
      tabContent.innerHTML=`<div class="panel">
        <div class="panel-title">🔬 WEATHER DETAILS</div>
        <div class="uv-bar-wrap">
          <div style="font-size:.76rem;font-weight:600;color:var(--text-secondary);margin-bottom:5px;">UV Index (est.): <strong style="color:#fff">${uv} — ${uvLbl}</strong></div>
          <div style="position:relative"><div class="uv-bar"></div><div class="uv-marker" style="margin-left:${uvPct}%"></div></div>
          <div class="uv-label-row" style="margin-top:7px"><span>Low</span><span>Moderate</span><span>High</span><span>Very High</span><span>Extreme</span></div>
        </div>
        <div class="uv-grid">
          <div class="uv-cell"><span class="uv-cell-label">Pressure</span><span class="uv-cell-value">${pressure}</span><span class="uv-cell-sub">hPa</span></div>
          <div class="uv-cell"><span class="uv-cell-label">Humidity</span><span class="uv-cell-value">${humidity}%</span><span class="uv-cell-sub">Relative</span></div>
          <div class="uv-cell"><span class="uv-cell-label">Wind Gusts</span><span class="uv-cell-value">${wGust}</span><span class="uv-cell-sub">${windLabel()} · ${wDir}</span></div>
          <div class="uv-cell"><span class="uv-cell-label">Cloud Cover</span><span class="uv-cell-value">${clouds}%</span><span class="uv-cell-sub">Sky coverage</span></div>
          <div class="uv-cell"><span class="uv-cell-label">🌅 Sunrise</span><span class="uv-cell-value" style="font-size:1.1rem">${sunrise}</span><span class="uv-cell-sub">Local time</span></div>
          <div class="uv-cell"><span class="uv-cell-label">🌇 Sunset</span><span class="uv-cell-value" style="font-size:1.1rem">${sunset}</span><span class="uv-cell-sub">Local time</span></div>
        </div>
      </div>`;
    }

    /* ── TABS ── */
    function renderTab(tab) {
      state.activeTab = tab;
      tabsBar.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
      if (tab==='hourly') renderHourly(state.forecastData);
      else if (tab==='daily') renderDaily(state.forecastData);
      else renderDetails(state.currentData);
    }
    tabsBar.addEventListener('click',e=>{ const b=e.target.closest('.tab-btn'); if(b) renderTab(b.dataset.tab); });

    /* ── FETCH ── */
    async function fetchAll(city) {
      renderLoading(); searchBtn.disabled=true; closeDropdown();
      const urlC=`${BASE}/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=en`;
      const urlF=`${BASE}/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=en`;
      try {
        const [rC,rF] = await Promise.all([fetch(urlC),fetch(urlF)]);
        if (rC.status===404) { renderError('City not found','Check the spelling and try again.'); return; }
        if (!rC.ok)          { renderError('Something went wrong','The weather service returned an error.'); return; }
        const [cur,fc] = await Promise.all([rC.json(),rF.json()]);
        state.currentData=cur; state.forecastData=fc.cod==='200'?fc:null;
        addToHistory(cur.name);
        renderWeather(cur);
        forecastSection.style.display='flex';
        renderTab(state.activeTab);
      } catch { renderError('Network error','Check your internet connection and try again.'); }
      finally  { searchBtn.disabled=false; }
    }

    async function fetchByCoords(lat, lon) {
      renderLoading(); searchBtn.disabled=true; closeDropdown();
      const urlC=`${BASE}/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=en`;
      const urlF=`${BASE}/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=en`;
      try {
        const [rC,rF] = await Promise.all([fetch(urlC),fetch(urlF)]);
        if (!rC.ok) { renderError('Something went wrong','Please try again.'); return; }
        const [cur,fc] = await Promise.all([rC.json(),rF.json()]);
        state.currentData=cur; state.forecastData=fc.cod==='200'?fc:null;
        cityInput.value=cur.name; addToHistory(cur.name);
        renderWeather(cur); forecastSection.style.display='flex'; renderTab(state.activeTab);
        showToast(`📍 ${cur.name}`);
      } catch { renderError('Network error','Check your connection.'); }
      finally  { searchBtn.disabled=false; }
    }

    /* ── GEO ── */
    geoBtn.addEventListener('click',()=>{
      if (!navigator.geolocation) { showToast('Geolocation not supported'); return; }
      geoBtn.classList.add('active'); showToast('📡 Detecting location…');
      navigator.geolocation.getCurrentPosition(
        pos => { geoBtn.classList.remove('active'); fetchByCoords(pos.coords.latitude,pos.coords.longitude); },
        ()  => { geoBtn.classList.remove('active'); showToast('Location access denied'); }
      );
    });

    /* ── SEARCH ── */
    searchBtn.addEventListener('click',()=>{
      const c=cityInput.value.trim();
      if (!c) { showToast('Please enter a city name'); cityInput.focus(); return; }
      fetchAll(c);
    });
    cityInput.addEventListener('keydown',e=>{
      if (e.key==='Enter') { const c=cityInput.value.trim(); if(c) fetchAll(c); else showToast('Please enter a city name'); }
    });

    /* ── INIT ── */
    if (state.history.length>0) { cityInput.value=state.history[0]; fetchAll(state.history[0]); }
    else renderHome();

  })();
  </script>
</body>
</html>
